name: version-bump

# Writes the next release version into every manifest on the PR branch. The
# PR title decides the bump (feat: minor, fix/perf: patch, "!": major) because
# it becomes the squash-merge commit; other types leave master's version.
# The bump commit carries [skip ci]: GitHub would otherwise hold the run its
# own push triggers for manual approval.
on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    # Pushing to a fork's branch needs that fork's permission.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bump manifests
        id: bump
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin master
          base=$(git show origin/master:plugin.json | jq -r .version)
          version=$(node scripts/version.mjs bump "$base" "$TITLE")
          echo "Base $base, PR version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit the bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "Manifests already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: set version to $VERSION [skip ci]"
          git push origin "HEAD:$BRANCH"
